# NOTE (reconciled 2026-07-04): this service is NOT Blueprint-synced. The live
# Render service is manually managed, so editing THIS FILE alone has no effect.
# Deploys are triggered by the render-redeploy.yml GitHub Action (POSTs the Render
# deploy hook on push to main); the service runs with autoDeploy = off. Any change
# here must ALSO be applied on the dashboard or via `render services update ...`.
# This file is kept as reference and now mirrors the actual live configuration.
services:
  - type: web
    name: stancestream
    env: node
    plan: starter
    # Matches live. Repo uses pnpm@10.14.0; --frozen-lockfile for reproducible installs.
    # Redis index seeding (setupCacheIndex.js / initCache.js) is handled out-of-band,
    # NOT at build time, so it is intentionally not part of buildCommand.
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Sentry backend error tracking. Set the value on the Render dashboard
      # (this file is reference-only, not Blueprint-synced). No-op until set.
      - key: SENTRY_DSN
        sync: false
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_BASE
        value: "https://api.openai.com/v1"
      - key: OPENAI_MODEL
        value: "gpt-4"
      - key: SIMILARITY_THRESHOLD
        value: "0.85"
      - key: CACHE_TTL
        value: "86400"
    # PORT intentionally omitted: Render injects PORT (10000) at runtime and the app
    # reads process.env.PORT. The prior hardcoded PORT=3000 was stale and misleading.
